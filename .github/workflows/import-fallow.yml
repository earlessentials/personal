name: Import Fallow Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-fallow.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pearl's Cove
        uses: actions/checkout@v4

      - name: Check out The Fallow Diagnostic
        run: git clone --depth 1 https://github.com/earlessentials/fallowdiagnostic.git /tmp/fallowdiagnostic

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the validated diagnostic
        run: |
          cd /tmp/fallowdiagnostic
          pnpm install --frozen-lockfile
          pnpm run build:pages

      - name: Add the diagnostic at /fallowdiagnostic
        run: |
          rm -rf "$GITHUB_WORKSPACE/public/fallowdiagnostic"
          mkdir -p "$GITHUB_WORKSPACE/public/fallowdiagnostic"
          cp -R /tmp/fallowdiagnostic/gh-pages/. "$GITHUB_WORKSPACE/public/fallowdiagnostic/"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fallowdiagnostic
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add The Fallow Diagnostic"
          git push origin main
